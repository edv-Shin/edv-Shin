name: Update blog posts

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://edvedv.tistory.com/rss"
          max_post_count: 5
          commit_message: "chore: 최신 글 갱신"
          # 티스토리는 Accept: application/rss+xml 을 406 으로 거절한다
          accept_header: "*/*"
          # 저장소가 조용할 때 더미 커밋을 남기지 않는다
          enable_keepalive: false
